name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

# Required so the workflow can push the SVG to the output branch
permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate snake SVG and push to output branch
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # Writing directly to the branch avoids a separate push step
          outputs: |
            output:github-contribution-grid-snake.svg
            output:github-contribution-grid-snake-dark.svg?palette=github-dark
